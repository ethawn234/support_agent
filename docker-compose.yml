version: '1.0'

services:

  n8n:
      image: docker.n8n.io/n8nio/n8n
      ports:
      - "5678:5678"
      environment:
      - N8N_HOST=localhost
      - N8N_METRICS="true" 
      - N8N_LOG_LEVEL="debug" 
      - N8N_METRICS_INCLUDE_QUEUE_METRICS="true"
      volumes:
      - incident_tracker:/home/node/.n8n


volumes:
  incident_tracker:
